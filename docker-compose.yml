# ReturnRight local stack (ADR-002). Core: docker compose up -d --build
# Streaming extras (Kafka, notifier, Mailpit): docker compose --profile streaming up -d
# Secrets: every secret comes from .env (git-ignored); create it with `cp .env.example .env` or infra/scripts/init-env.ps1
name: returnright

x-app-env: &app-env
  RR_DB_URL: jdbc:postgresql://db:5432/returnright
  RR_DB_USER: rr_app
  RR_DB_PASSWORD: ${RR_APP_DB_PASSWORD:?set RR_APP_DB_PASSWORD in .env (see .env.example)}
  RR_DB_OWNER_USER: rr_owner
  RR_DB_OWNER_PASSWORD: ${RR_OWNER_DB_PASSWORD:?set RR_OWNER_DB_PASSWORD in .env (see .env.example)}
  RR_REDIS_HOST: redis
  RR_REDIS_PASSWORD: ${RR_REDIS_PASSWORD:?set RR_REDIS_PASSWORD in .env (see .env.example)}
  RR_GATEWAY_URL: http://gateway:8100
  RR_JWT_SECRET: ${RR_JWT_SECRET:?set RR_JWT_SECRET in .env (see .env.example)}
  GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env (see .env.example)}
  RR_SEED_STAFF_PASSWORD: ${RR_SEED_STAFF_PASSWORD:?set RR_SEED_STAFF_PASSWORD in .env (see .env.example)}
  RR_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  RR_KAFKA_BOOTSTRAP: kafka:9092
  RR_KAFKA_ENABLED: ${RR_KAFKA_ENABLED:-false}
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Duser.timezone=UTC

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: rr_owner
      POSTGRES_PASSWORD: ${RR_OWNER_DB_PASSWORD:?set RR_OWNER_DB_PASSWORD in .env (see .env.example)}
      RR_APP_DB_PASSWORD: ${RR_APP_DB_PASSWORD:?set RR_APP_DB_PASSWORD in .env (see .env.example)}
      RR_READONLY_DB_PASSWORD: ${RR_READONLY_DB_PASSWORD:?set RR_READONLY_DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: returnright
    ports: ["${RR_DB_HOST_PORT:-5434}:5432"]  # 5434 on the host: laptops often run a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rr_owner -d returnright"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${RR_REDIS_PASSWORD:?set RR_REDIS_PASSWORD in .env (see .env.example)}
    command: ["redis-server", "--requirepass", "${RR_REDIS_PASSWORD:?set RR_REDIS_PASSWORD in .env (see .env.example)}", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    environment:
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env (see .env.example)}
      GATEWAY_ENV: dev
      LATENCY_MS_MIN: ${LATENCY_MS_MIN:-50}
      LATENCY_MS_MAX: ${LATENCY_MS_MAX:-200}
      FAULT_SEED: ${FAULT_SEED:-42}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    ports: ["8100:8100"]
    volumes: ["gatewaydata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./backend
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on:
      app: { condition: service_healthy }

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@returnright.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env (see .env.example)}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env (see .env.example)}
      RR_READONLY_DB_PASSWORD: ${RR_READONLY_DB_PASSWORD:?set RR_READONLY_DB_PASSWORD in .env (see .env.example)}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/returnright.json
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---------------- profile: streaming ----------------
  kafka:
    image: apache/kafka:4.1.0
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["streaming"]
    ports: ["8025:8025"]

  notifier:
    build: ./notifier
    profiles: ["streaming"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on: [kafka, mailpit]

volumes:
  pgdata:
  gatewaydata:
