apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: ReturnRight DB (read-only)
    uid: returnright-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: rr_readonly
    jsonData:
      database: returnright
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: $RR_READONLY_DB_PASSWORD   # injected from the container env (.env)
