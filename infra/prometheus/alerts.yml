# Part 2 §15.2. Shown in Prometheus (/alerts) and Grafana; no Alertmanager on purpose (single laptop).
groups:
  - name: returnright-refunds
    rules:
      - alert: RefundSuccessRateLow
        expr: |
          (
            sum(rate(rr_refund_attempts_total{outcome="succeeded"}[5m]))
            / sum(rate(rr_refund_attempts_total[5m]))
          ) < 0.90
          and sum(rate(rr_refund_attempts_total[5m])) > 0.005
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Refund success rate below 90% for 2 minutes"
          description: >-
            Check the gateway latency/error panels and GET /admin/faults on the gateway.
            UNKNOWN attempts are reconciled automatically - do NOT retry them manually (ADR-001).
      - alert: RefundReconciliationStuck
        expr: rr_refund_attempts_unknown_oldest_age_seconds > 900 and rr_refund_attempts_unknown > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "A refund attempt has been UNKNOWN for more than 15 minutes"
          description: "docs/RUNBOOK.md, Operations > Alerts: press Recheck with gateway; never retry an UNKNOWN attempt (ADR-001)"
      - alert: LedgerReconciliationMismatch
        expr: max(rr_reconciliation_mismatches{check=~"R1|R2|R4"}) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Ledger does not reconcile with refunds (possible double payment or missing posting)"
